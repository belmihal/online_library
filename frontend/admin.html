<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitHub — Панель администратора</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <header id="app-header"></header>

    <main class="container">
      <div id="admin-root"></div>
    </main>

    <footer id="app-footer"></footer>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function AdminApp() {
        const user = getCurrentUser();

        if (!user || user.role !== 'admin') {
          window.location.href = 'index.html';
          return null;
        }

        const [books, setBooks] = useState([]);
        const [authors, setAuthors] = useState([]);
        const [genres, setGenres] = useState([]);
        const [loading, setLoading] = useState(true);

        const [error, setError] = useState('');
        const [successMessage, setSuccessMessage] = useState('');

        const [title, setTitle] = useState('');
        const [isbn, setIsbn] = useState('');
        const [publishedYear, setPublishedYear] = useState(2024);
        const [pages, setPages] = useState(250);
        const [publisher, setPublisher] = useState('АСТ');
        const [coverUrl, setCoverUrl] = useState('');
        const [description, setDescription] = useState('');
        const [selectedAuthorIds, setSelectedAuthorIds] = useState([]);
        const [selectedGenreIds, setSelectedGenreIds] = useState([]);
        const [creatingBook, setCreatingBook] = useState(false);

        const [csvFile, setCsvFile] = useState(null);
        const [csvUploading, setCsvUploading] = useState(false);

        async function loadAdminData() {
          setLoading(true);
          try {
            const [booksData, authorsData, genresData] = await Promise.all([
              apiFetch('/books/?page_size=100'),
              apiFetch('/authors/'),
              apiFetch('/genres/'),
            ]);
            setBooks(Array.isArray(booksData) ? booksData : booksData.results || []);
            setAuthors(Array.isArray(authorsData) ? authorsData : authorsData.results || []);
            setGenres(Array.isArray(genresData) ? genresData : genresData.results || []);
          } catch (err) {
            setError(err.message || 'Ошибка при загрузке данных админ-панели.');
          } finally {
            setLoading(false);
          }
        }

        useEffect(() => {
          loadAdminData();
        }, []);

        function toggleAuthorId(id) {
          setSelectedAuthorIds((prev) =>
            prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
          );
        }

        function toggleGenreId(id) {
          setSelectedGenreIds((prev) =>
            prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
          );
        }

        async function handleCreateBook(event) {
          event.preventDefault();
          setError('');
          setSuccessMessage('');
          setCreatingBook(true);

          try {
            await apiFetch('/books/', {
              method: 'POST',
              body: JSON.stringify({
                title: title.trim(),
                isbn: isbn.trim(),
                published_year: Number(publishedYear),
                pages: Number(pages),
                publisher: publisher.trim(),
                cover_url: coverUrl.trim(),
                description: description.trim(),
                author_ids: selectedAuthorIds,
                genre_ids: selectedGenreIds,
              }),
            });

            setSuccessMessage('Книга «' + title + '» успешно добавлена в каталог LitHub!');
            setTitle('');
            setIsbn('');
            setCoverUrl('');
            setDescription('');
            setSelectedAuthorIds([]);
            setSelectedGenreIds([]);

            await loadAdminData();
          } catch (err) {
            setError(err.message || 'Ошибка при создании книги.');
          } finally {
            setCreatingBook(false);
          }
        }

        async function handleCsvUpload(event) {
          event.preventDefault();
          setError('');
          setSuccessMessage('');

          if (!csvFile) {
            setError('Пожалуйста, выберите файл формата .csv для загрузки.');
            return;
          }

          setCsvUploading(true);
          try {
            const result = await uploadBooksCsv(csvFile);
            setSuccessMessage(
              result.detail ||
                'Импорт завершен: создано ' + result.created + ', обновлено ' + result.updated + '.'
            );
            setCsvFile(null);
            await loadAdminData();
          } catch (err) {
            setError(err.message || 'Ошибка при импорте CSV-файла.');
          } finally {
            setCsvUploading(false);
          }
        }

        async function handleDeleteBook(bookId, bookTitle) {
          setError('');
          setSuccessMessage('');
          try {
            await apiFetch('/books/' + bookId + '/', { method: 'DELETE' });
            setSuccessMessage('Книга «' + bookTitle + '» удалена из каталога.');
            await loadAdminData();
          } catch (err) {
            setError(err.message || 'Не удалось удалить книгу.');
          }
        }

        return (
          <div>
            <h1 className="page-title">Панель администратора LitHub</h1>

            {error && <div className="alert alert-error">{error}</div>}
            {successMessage && <div className="alert alert-success">{successMessage}</div>}

            <div className="card">
              <h2 className="section-title">Массовый импорт книг из CSV-файла</h2>
              <p style={{ fontSize: '0.9rem', color: 'var(--muted-color)', marginBottom: '12px' }}>
                Поддерживаются колонки:{' '}
                <code>title, isbn, published_year, publisher, pages, cover_url, description</code>.
              </p>

              <form
                onSubmit={handleCsvUpload}
                style={{ display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap' }}
              >
                <input
                  type="file"
                  accept=".csv,text/csv"
                  className="input"
                  style={{ maxWidth: '360px' }}
                  onChange={(e) =>
                    setCsvFile(e.target.files && e.target.files[0] ? e.target.files[0] : null)
                  }
                />
                <button type="submit" className="btn btn-primary" disabled={csvUploading}>
                  {csvUploading ? 'Загружаем CSV...' : '📥 Импортировать из CSV'}
                </button>
              </form>
            </div>

            <div className="card">
              <h2 className="section-title">Добавить новую книгу в каталог</h2>

              <form onSubmit={handleCreateBook}>
                <div
                  style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))',
                    gap: '12px',
                  }}
                >
                  <div className="form-group">
                    <label htmlFor="book-title">Название книги *</label>
                    <input
                      id="book-title"
                      type="text"
                      className="input"
                      placeholder="Например: Ревизор"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label htmlFor="book-isbn">ISBN (уникальный код) *</label>
                    <input
                      id="book-isbn"
                      type="text"
                      className="input"
                      placeholder="978-5-17-099999-1"
                      value={isbn}
                      onChange={(e) => setIsbn(e.target.value)}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label htmlFor="book-year">Год издания</label>
                    <input
                      id="book-year"
                      type="number"
                      className="input"
                      value={publishedYear}
                      onChange={(e) => setPublishedYear(e.target.value)}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label htmlFor="book-pages">Количество страниц</label>
                    <input
                      id="book-pages"
                      type="number"
                      className="input"
                      value={pages}
                      onChange={(e) => setPages(e.target.value)}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label htmlFor="book-publisher">Издательство</label>
                    <input
                      id="book-publisher"
                      type="text"
                      className="input"
                      value={publisher}
                      onChange={(e) => setPublisher(e.target.value)}
                    />
                  </div>

                  <div className="form-group">
                    <label htmlFor="book-cover-url">URL обложки книги (необязательно)</label>
                    <input
                      id="book-cover-url"
                      type="url"
                      className="input"
                      placeholder="https://example.com/cover.jpg"
                      value={coverUrl}
                      onChange={(e) => setCoverUrl(e.target.value)}
                    />
                  </div>
                </div>

                <div className="form-group" style={{ marginTop: '8px' }}>
                  <label>Выберите авторов книги:</label>
                  <div className="badges-row">
                    {authors.map((a) => (
                      <label
                        key={a.id}
                        className="badge"
                        style={{
                          cursor: 'pointer',
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '6px',
                        }}
                      >
                        <input
                          type="checkbox"
                          checked={selectedAuthorIds.includes(a.id)}
                          onChange={() => toggleAuthorId(a.id)}
                        />
                        {a.full_name || a.first_name + ' ' + a.last_name}
                      </label>
                    ))}
                  </div>
                </div>

                <div className="form-group">
                  <label>Выберите жанры книги:</label>
                  <div className="badges-row">
                    {genres.map((g) => (
                      <label
                        key={g.id}
                        className="badge"
                        style={{
                          cursor: 'pointer',
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '6px',
                        }}
                      >
                        <input
                          type="checkbox"
                          checked={selectedGenreIds.includes(g.id)}
                          onChange={() => toggleGenreId(g.id)}
                        />
                        {g.name}
                      </label>
                    ))}
                  </div>
                </div>

                <div className="form-group">
                  <label htmlFor="book-desc">Описание книги</label>
                  <textarea
                    id="book-desc"
                    className="textarea"
                    placeholder="Краткая аннотация книги..."
                    value={description}
                    onChange={(e) => setDescription(e.target.value)}
                  />
                </div>

                <button type="submit" className="btn btn-primary" disabled={creatingBook}>
                  {creatingBook ? 'Сохраняем...' : '➕ Добавить книгу'}
                </button>
              </form>
            </div>

            <div className="card">
              <h2 className="section-title">Управление книгами в каталоге ({books.length})</h2>

              {loading ? (
                <p>Загрузка таблицы книг...</p>
              ) : (
                <div className="table-wrapper">
                  <table className="table">
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Авторы / ISBN</th>
                        <th>Год</th>
                        <th>Страниц</th>
                        <th>Рейтинг</th>
                        <th>Действия</th>
                      </tr>
                    </thead>
                    <tbody>
                      {books.map((b) => {
                        const authorsText = formatBookAuthors(b);
                        return (
                          <tr key={b.id}>
                            <td>{b.id}</td>
                            <td>
                              <a href={'book.html?id=' + b.id}>
                                <strong>{b.title}</strong>
                              </a>
                            </td>
                            <td>
                              <div>{authorsText}</div>
                              <div style={{ fontSize: '0.82rem', color: 'var(--muted-color)' }}>
                                {b.isbn}
                              </div>
                            </td>
                            <td>{b.published_year}</td>
                            <td>{b.pages}</td>
                            <td>⭐ {Number(b.avg_rating || 0).toFixed(1)}</td>
                            <td>
                              <button
                                type="button"
                                className="btn btn-danger"
                                onClick={() => handleDeleteBook(b.id, b.title)}
                              >
                                Удалить
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
    </script>
  </body>
</html>
