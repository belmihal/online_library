<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitHub — Просмотр книги</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <header id="app-header"></header>

    <main class="container">
      <div id="book-root"></div>
    </main>

    <footer id="app-footer"></footer>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Компонент вертикальной книжной обложки
      function BookCover({ book }) {
        const [imgError, setImgError] = useState(false);
        const hasValidImage = Boolean(book.cover_url && book.cover_url.trim() && !imgError);

        if (hasValidImage) {
          return (
            <div className="book-cover-wrapper">
              <img
                src={book.cover_url}
                alt={book.title}
                className="book-cover-img"
                onError={() => setImgError(true)}
              />
            </div>
          );
        }

        const paletteIndex = Math.abs(Number(book.id || 0)) % COVER_PALETTES.length;
        const primaryGenre =
          book.genres && book.genres.length > 0 ? book.genres[0].name : 'Цифровое издание';
        const authorLine = formatBookAuthors(book);

        return (
          <div className="book-cover-wrapper">
            <div className="book-cover-styled" style={{ background: COVER_PALETTES[paletteIndex] }}>
              <div className="book-cover-spine" />
              <div className="book-cover-frame">
                <div className="book-cover-genre">{primaryGenre}</div>
                <div className="book-cover-title">{book.title}</div>
                <div className="book-cover-footer">
                  <div className="book-cover-author">{authorLine}</div>
                  {book.published_year && (
                    <div className="book-cover-year">{book.published_year} г.</div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      function BookDetailApp() {
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');
        const user = getCurrentUser();

        const [book, setBook] = useState(null);
        const [reviews, setReviews] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState('');

        // Состояния полки (/api/v1/shelf/) и встроенной читалки
        const [shelfItem, setShelfItem] = useState(null);
        const [shelfLoading, setShelfLoading] = useState(false);
        const [shelfMessage, setShelfMessage] = useState('');
        const [shelfError, setShelfError] = useState('');
        const [isReaderOpen, setIsReaderOpen] = useState(false);
        const [readerFontSize, setReaderFontSize] = useState(17);

        // Состояния формы отзыва
        const [rating, setRating] = useState(5);
        const [comment, setComment] = useState('');
        const [reviewLoading, setReviewLoading] = useState(false);
        const [reviewMessage, setReviewMessage] = useState('');
        const [reviewError, setReviewError] = useState('');

        async function loadBookData() {
          if (!bookId) {
            setError('Не указан идентификатор книги (?id=...).');
            setLoading(false);
            return;
          }

          setLoading(true);
          setError('');
          try {
            const [bookData, reviewsData] = await Promise.all([
              apiFetch('/books/' + bookId + '/'),
              apiFetch('/reviews/?book=' + bookId),
            ]);
            setBook(bookData);
            document.title = 'LitHub — ' + bookData.title;
            setReviews(Array.isArray(reviewsData) ? reviewsData : reviewsData.results || []);

            if (user) {
              const shelfData = await apiFetch('/shelf/');
              const shelfList = Array.isArray(shelfData) ? shelfData : shelfData.results || [];
              const existing = shelfList.find((item) => item.book === Number(bookId)) || null;
              setShelfItem(existing);
            } else {
              setShelfItem(null);
            }
          } catch (err) {
            setError(err.message || 'Не удалось загрузить данные книги.');
          } finally {
            setLoading(false);
          }
        }

        useEffect(() => {
          loadBookData();
        }, []);

        async function handleAddToShelf() {
          setShelfError('');
          setShelfMessage('');
          setShelfLoading(true);
          try {
            const created = await apiFetch('/shelf/', {
              method: 'POST',
              body: JSON.stringify({ book: Number(bookId) }),
            });
            setShelfItem(created);
            setShelfMessage('Книга добавлена на вашу книжную полку LitHub!');
          } catch (err) {
            setShelfError(err.message || 'Не удалось добавить книгу на полку.');
          } finally {
            setShelfLoading(false);
          }
        }

        async function handleRemoveFromShelf() {
          if (!shelfItem) return;
          setShelfError('');
          setShelfMessage('');
          setShelfLoading(true);
          try {
            await apiFetch('/shelf/' + shelfItem.id + '/', { method: 'DELETE' });
            setShelfItem(null);
            setShelfMessage('Книга убрана с вашей книжной полки.');
          } catch (err) {
            setShelfError(err.message || 'Не удалось убрать книгу с полки.');
          } finally {
            setShelfLoading(false);
          }
        }

        async function handleAddReview(event) {
          event.preventDefault();
          setReviewError('');
          setReviewMessage('');
          setReviewLoading(true);

          try {
            await apiFetch('/reviews/', {
              method: 'POST',
              body: JSON.stringify({
                book: Number(bookId),
                rating: Number(rating),
                comment: comment.trim(),
              }),
            });
            setComment('');
            setRating(5);
            setReviewMessage('Спасибо! Ваш отзыв опубликован, средний рейтинг книги обновлен.');
            await loadBookData();
          } catch (err) {
            setReviewError(err.message || 'Не удалось опубликовать отзыв.');
          } finally {
            setReviewLoading(false);
          }
        }

        async function handleDeleteReview(reviewId) {
          setReviewError('');
          setReviewMessage('');
          try {
            await apiFetch('/reviews/' + reviewId + '/', { method: 'DELETE' });
            setReviewMessage('Отзыв удален, средний рейтинг книги обновлен.');
            await loadBookData();
          } catch (err) {
            setReviewError(err.message || 'Не удалось удалить отзыв.');
          }
        }

        if (loading) {
          return <div className="card">Загрузка информации о книге...</div>;
        }

        if (error || !book) {
          return (
            <div className="card">
              <div className="alert alert-error">{error || 'Книга не найдена'}</div>
              <a href="index.html" className="btn btn-outline">
                ← Вернуться в каталог
              </a>
            </div>
          );
        }

        const authorsText = formatBookAuthors(book);
        const readerText =
          (book.sample_text && book.sample_text.trim()) ||
          book.description ||
          'Электронный фрагмент произведения доступен в цифровой библиотеке LitHub.';

        return (
          <div>
            <div style={{ marginBottom: '16px' }}>
              <a href="index.html" className="btn btn-outline">
                ← Назад в каталог
              </a>
            </div>

            <div className="card">
              <div className="book-detail-layout">
                <div className="book-detail-cover">
                  <BookCover book={book} />
                </div>

                <div className="book-detail-info">
                  <h1 className="page-title">{book.title}</h1>

                  <div className="badges-row" style={{ marginBottom: '12px' }}>
                    <span className="badge">
                      ⭐ {Number(book.avg_rating || 0).toFixed(1)} ({reviews.length} отз.)
                    </span>
                    <span className="badge badge-digital">
                      📱 Цифровое издание • {book.pages} стр.
                    </span>
                    {book.genres &&
                      book.genres.map((g) => (
                        <a
                          key={g.id}
                          href={'search.html?genre=' + encodeURIComponent(g.slug || g.id)}
                          className="badge badge-link"
                        >
                          {g.name}
                        </a>
                      ))}
                  </div>

                  <p style={{ marginBottom: '8px' }}>
                    <strong>Авторы:</strong> {authorsText}
                  </p>
                  <p style={{ marginBottom: '8px' }}>
                    <strong>ISBN:</strong> {book.isbn} • <strong>Год издания:</strong> 
                    {book.published_year} • <strong>Страниц:</strong> {book.pages} • 
                    <strong>Язык:</strong> {book.language}
                  </p>
                  {book.publisher && (
                    <p style={{ marginBottom: '12px' }}>
                      <strong>Издательство:</strong> {book.publisher}
                    </p>
                  )}

                  <p style={{ marginTop: '12px', lineHeight: 1.65 }}>
                    {book.description || 'Описание для этой книги пока не добавлено.'}
                  </p>
                </div>
              </div>
            </div>

            {/* Блок «Цифровой доступ к книге» */}
            <div className="card">
              <h2 className="section-title">Цифровой доступ к книге</h2>

              {shelfError && <div className="alert alert-error">{shelfError}</div>}
              {shelfMessage && <div className="alert alert-success">{shelfMessage}</div>}

              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
                <button
                  type="button"
                  className="btn btn-primary"
                  onClick={() => setIsReaderOpen((prev) => !prev)}
                >
                  {isReaderOpen ? '📕 Закрыть читалку' : '📖 Читать онлайн'}
                </button>

                {!user ? (
                  <span style={{ color: 'var(--muted-color)', fontSize: '0.92rem' }}>
                    <a href="login.html">Войдите</a> или <a href="register.html">зарегистрируйтесь</a>,
                    чтобы сохранить книгу на свою полку.
                  </span>
                ) : shelfItem ? (
                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
                    <span className="badge badge-digital" style={{ padding: '7px 12px', fontSize: '0.88rem' }}>
                      ✓ Книга на вашей полке
                    </span>
                    <button
                      type="button"
                      className="btn btn-outline"
                      onClick={handleRemoveFromShelf}
                      disabled={shelfLoading}
                    >
                      {shelfLoading ? 'Обновляем...' : 'Убрать с полки'}
                    </button>
                  </div>
                ) : (
                  <button
                    type="button"
                    className="btn btn-outline"
                    onClick={handleAddToShelf}
                    disabled={shelfLoading}
                  >
                    {shelfLoading ? 'Добавляем...' : '➕ Добавить на мою полку'}
                  </button>
                )}
              </div>

              {isReaderOpen && (
                <div className="reader-box">
                  <div className="reader-toolbar">
                    <div>
                      <strong>{book.title}</strong> — 
                      <span style={{ color: 'var(--muted-color)' }}>{authorsText}</span>
                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <span style={{ fontSize: '0.85rem', color: 'var(--muted-color)' }}>
                        Шрифт: {readerFontSize}px
                      </span>
                      <button
                        type="button"
                        className="btn btn-outline"
                        onClick={() => setReaderFontSize((s) => Math.max(13, s - 2))}
                        title="Уменьшить шрифт"
                      >
                        A-
                      </button>
                      <button
                        type="button"
                        className="btn btn-outline"
                        onClick={() => setReaderFontSize((s) => Math.min(28, s + 2))}
                        title="Увеличить шрифт"
                      >
                        A+
                      </button>
                    </div>
                  </div>

                  <div className="reader-content" style={{ fontSize: readerFontSize + 'px' }}>
                    <p style={{ fontWeight: 700, marginBottom: '10px' }}>
                      Ознакомительный фрагмент цифрового издания LitHub
                    </p>
                    <p style={{ marginBottom: '12px' }}>{readerText}</p>
                    <p style={{ color: 'var(--muted-color)', fontSize: '0.9em' }}>
                      Издание: {book.publisher || 'LitHub Digital'}, {book.published_year} г. • Объем: 
                      {book.pages} стр. • ISBN {book.isbn}.
                    </p>
                  </div>
                </div>
              )}
            </div>

            {/* Секция отзывов */}
            <div className="card">
              <h2 className="section-title">Отзывы читателей ({reviews.length})</h2>

              {reviewError && <div className="alert alert-error">{reviewError}</div>}
              {reviewMessage && <div className="alert alert-success">{reviewMessage}</div>}

              {user ? (
                <form
                  onSubmit={handleAddReview}
                  style={{
                    marginBottom: '24px',
                    paddingBottom: '20px',
                    borderBottom: '1px solid var(--border-color)',
                  }}
                >
                  <h3 style={{ fontSize: '1.05rem', marginBottom: '12px' }}>Оставить свой отзыв</h3>

                  <div className="form-group" style={{ maxWidth: '240px' }}>
                    <label htmlFor="review-rating">Ваша оценка (от 1 до 5)</label>
                    <select
                      id="review-rating"
                      className="select"
                      value={rating}
                      onChange={(e) => setRating(Number(e.target.value))}
                    >
                      <option value={5}>5 — Отлично (Шедевр)</option>
                      <option value={4}>4 — Хорошо</option>
                      <option value={3}>3 — Нормально</option>
                      <option value={2}>2 — Слабо</option>
                      <option value={1}>1 — Плохо</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label htmlFor="review-comment">Текст отзыва</label>
                    <textarea
                      id="review-comment"
                      className="textarea"
                      placeholder="Поделитесь впечатлениями о книге..."
                      value={comment}
                      onChange={(e) => setComment(e.target.value)}
                      required
                    />
                  </div>

                  <button type="submit" className="btn btn-primary" disabled={reviewLoading}>
                    {reviewLoading ? 'Публикуем...' : 'Опубликовать отзыв'}
                  </button>
                </form>
              ) : (
                <p style={{ marginBottom: '18px' }}>
                  <a href="login.html">Войдите в аккаунт</a>, чтобы оставить оценку и отзыв о книге.
                </p>
              )}

              {reviews.length === 0 ? (
                <p style={{ color: 'var(--muted-color)' }}>
                  На эту книгу пока нет отзывов. Станьте первым!
                </p>
              ) : (
                <div className="books-list">
                  {reviews.map((rev) => {
                    const canDelete = user && (user.role === 'admin' || user.id === rev.user);
                    return (
                      <div
                        key={rev.id}
                        style={{
                          padding: '14px',
                          borderRadius: '8px',
                          border: '1px solid var(--border-color)',
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'flex-start',
                          gap: '12px',
                        }}
                      >
                        <div>
                          <div style={{ fontWeight: 700, marginBottom: '4px' }}>
                            👤 {rev.username || 'Пользователь #' + rev.user} • 
                            <span className="badge">
                              Оценка: {'⭐'.repeat(rev.rating)} ({rev.rating}/5)
                            </span>
                          </div>
                          <p style={{ marginTop: '6px' }}>{rev.comment}</p>
                          {rev.created_at && (
                            <div
                              style={{
                                fontSize: '0.8rem',
                                color: 'var(--muted-color)',
                                marginTop: '6px',
                              }}
                            >
                              Дата: {new Date(rev.created_at).toLocaleDateString('ru-RU')}
                            </div>
                          )}
                        </div>

                        {canDelete && (
                          <button
                            type="button"
                            className="btn btn-danger"
                            onClick={() => handleDeleteReview(rev.id)}
                          >
                            Удалить
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('book-root')).render(<BookDetailApp />);
    </script>
  </body>
</html>
